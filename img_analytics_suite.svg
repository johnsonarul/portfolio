<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1a" />
      <stop offset="100%" stop-color="#121835" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.1)" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="rgba(79, 172, 254, 0.1)" />
    </linearGradient>
    <linearGradient id="chartGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="rgba(255, 215, 0, 0.1)" />
    </linearGradient>
    <linearGradient id="powerBiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c811" />
      <stop offset="100%" stop-color="#e27c1a" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <circle cx="720" cy="120" r="130" fill="#f2c811" opacity="0.1" filter="url(#glow3)" />
  <circle cx="100" cy="350" r="120" fill="#00f2fe" opacity="0.1" filter="url(#glow3)" />

  <!-- Main Container -->
  <rect x="50" y="35" width="700" height="380" rx="16" fill="rgba(14, 20, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="35" width="700" height="45" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="78" cy="57" r="6" fill="#ff5f56" />
  <circle cx="98" cy="57" r="6" fill="#ffbd2e" />
  <circle cx="118" cy="57" r="6" fill="#27c93f" />
  <text x="145" y="62" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Enterprise Business Intelligence &amp; Analytics Dashboard • Power BI &amp; Python</text>

  <!-- Left: KPI Cards -->
  <g transform="translate(75, 95)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="180" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(0,242,254,0.3)" />
    <text x="15" y="25" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Data Cleaned &amp; Modeled</text>
    <text x="15" y="55" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="24" font-weight="700">1.2M+</text>
    <text x="15" y="73" fill="#27c93f" font-family="'Outfit', sans-serif" font-size="10">▲ 99.8% Quality Index</text>

    <!-- KPI 2 -->
    <rect x="0" y="95" width="180" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(242, 200, 17, 0.3)" />
    <text x="15" y="120" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Automated DAX Measures</text>
    <text x="15" y="150" fill="#ffd700" font-family="'Outfit', sans-serif" font-size="24" font-weight="700">45+</text>
    <text x="15" y="168" fill="#ffd700" font-family="'Outfit', sans-serif" font-size="10">● Dynamic KPI Scorecards</text>

    <!-- KPI 3 -->
    <rect x="0" y="190" width="180" height="95" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(79, 172, 254, 0.3)" />
    <text x="15" y="215" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Query Execution Speed</text>
    <text x="15" y="248" fill="#4facfe" font-family="'Outfit', sans-serif" font-size="24" font-weight="700">&lt; 140ms</text>
    <text x="15" y="268" fill="#27c93f" font-family="'Outfit', sans-serif" font-size="10">▲ Optimized SQL Queries</text>
  </g>

  <!-- Middle/Right: 3D Bar Chart Visualizer -->
  <g transform="translate(275, 95)">
    <rect x="0" y="0" width="445" height="180" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="25" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Quarterly KPI Growth &amp; Generation Analysis</text>
    
    <!-- Grid -->
    <line x1="20" y1="145" x2="425" y2="145" stroke="rgba(255,255,255,0.12)" />
    <line x1="20" y1="105" x2="425" y2="105" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3" />
    <line x1="20" y1="65" x2="425" y2="65" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3" />

    <!-- 3D Bar Groups -->
    <!-- Group 1 -->
    <rect x="40" y="80" width="22" height="65" rx="4" fill="url(#chartGrad1)" />
    <rect x="66" y="95" width="22" height="50" rx="4" fill="url(#chartGrad2)" />
    <text x="48" y="162" fill="#8892b0" font-size="10">Q1</text>

    <!-- Group 2 -->
    <rect x="120" y="65" width="22" height="80" rx="4" fill="url(#chartGrad1)" />
    <rect x="146" y="85" width="22" height="60" rx="4" fill="url(#chartGrad2)" />
    <text x="128" y="162" fill="#8892b0" font-size="10">Q2</text>

    <!-- Group 3 -->
    <rect x="200" y="50" width="22" height="95" rx="4" fill="url(#chartGrad1)" />
    <rect x="226" y="70" width="22" height="75" rx="4" fill="url(#chartGrad2)" />
    <text x="208" y="162" fill="#8892b0" font-size="10">Q3</text>

    <!-- Group 4 -->
    <rect x="280" y="35" width="22" height="110" rx="4" fill="url(#chartGrad1)" />
    <rect x="306" y="45" width="22" height="100" rx="4" fill="url(#chartGrad3)" />
    <text x="288" y="162" fill="#8892b0" font-size="10">Q4</text>

    <!-- Legend -->
    <rect x="355" y="15" width="10" height="10" rx="2" fill="#00f2fe" />
    <text x="370" y="24" fill="#8892b0" font-size="10">Power BI</text>
    <rect x="355" y="32" width="10" height="10" rx="2" fill="#ffd700" />
    <text x="370" y="41" fill="#8892b0" font-size="10">Target</text>
  </g>

  <!-- Bottom Analytics Breakdown -->
  <g transform="translate(275, 290)">
    <rect x="0" y="0" width="445" height="90" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="25" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">Analytics Tech Stack Efficiency</text>

    <text x="20" y="50" fill="#8892b0" font-size="11">Python Pandas / NumPy</text>
    <rect x="160" y="42" width="260" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
    <rect x="160" y="42" width="240" height="8" rx="4" fill="#00f2fe" />

    <text x="20" y="75" fill="#8892b0" font-size="11">SQL Complex Queries &amp; Joins</text>
    <rect x="160" y="67" width="260" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
    <rect x="160" y="67" width="245" height="8" rx="4" fill="#ffd700" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#141c3a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <circle cx="680" cy="90" r="130" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="120" cy="360" r="110" fill="#8a2be2" opacity="0.12" filter="url(#glow)" />

  <rect x="50" y="35" width="700" height="380" rx="16" fill="rgba(16, 22, 48, 0.75)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />

  <rect x="50" y="35" width="700" height="45" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="78" cy="57" r="6" fill="#ff5f56" />
  <circle cx="98" cy="57" r="6" fill="#ffbd2e" />
  <circle cx="118" cy="57" r="6" fill="#27c93f" />
  <text x="145" y="62" fill="#e0e6ed" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Smart Government Bus Portal • Passenger &amp; Analytics Hub</text>

  <rect x="70" y="100" width="160" height="295" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
  <rect x="85" y="120" width="130" height="28" rx="6" fill="url(#cyanGrad)" opacity="0.2" />
  <text x="100" y="139" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">Dashboard</text>
  <text x="100" y="175" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="12">Digital Wallet</text>
  <text x="100" y="210" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="12">Route Tracking</text>
  <text x="100" y="245" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="12">Razorpay Logs</text>
  <text x="100" y="280" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="12">Admin Analytics</text>

  <rect x="250" y="100" width="140" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(0, 242, 254, 0.2)" />
  <text x="265" y="125" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Total Passengers</text>
  <text x="265" y="155" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">24,580</text>

  <rect x="405" y="100" width="140" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(79, 172, 254, 0.2)" />
  <text x="420" y="125" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Wallet Revenue</text>
  <text x="420" y="155" fill="#4facfe" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">₹4.82L</text>

  <rect x="560" y="100" width="165" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255, 215, 0, 0.25)" />
  <text x="575" y="125" fill="#8892b0" font-family="'Outfit', sans-serif" font-size="11">Razorpay Success</text>
  <text x="575" y="155" fill="#ffd700" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">99.4%</text>

  <rect x="250" y="190" width="475" height="205" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" />
  <text x="270" y="218" fill="#e0e6ed" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Transit Volume &amp; Daily Ticketing Trends (Chart.js)</text>
  
  <line x1="270" y1="350" x2="700" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <line x1="270" y1="305" x2="700" y2="305" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4" />
  <line x1="270" y1="260" x2="700" y2="260" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4" />

  <path d="M 280 340 Q 340 260, 400 290 T 520 230 T 640 250 T 690 220 L 690 350 L 280 350 Z" fill="url(#cyanGrad)" opacity="0.18" />
  <path d="M 280 340 Q 340 260, 400 290 T 520 230 T 640 250 T 690 220" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />
  
  <circle cx="280" cy="340" r="4" fill="#00f2fe" />
  <circle cx="400" cy="290" r="4" fill="#00f2fe" />
  <circle cx="520" cy="230" r="4" fill="#00f2fe" />
  <circle cx="640" cy="250" r="4" fill="#00f2fe" />
  <circle cx="690" cy="220" r="5" fill="#ffd700" />
